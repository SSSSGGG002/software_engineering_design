{% extends 'base.html' %}{% block content %}<h1>{{ '添加' if mode=='new' else '修改' }}{{ k.label }}</h1><form class="panel narrow" method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">{% if person %}<p>系统编号：{{ person.id }} · 用户名：{{ person.username }}</p>{% endif %}<label>姓名<input name="name" value="{{ form.get('name','') }}" required maxlength="50"></label><label>出生日期<input type="date" name="birth_date" value="{{ form.get('birth_date','') }}" required></label><label>社会保障号（题目字段；演示请使用虚构数据）<input name="ssn" value="{{ form.get('ssn','') }}" placeholder="123-45-6789" required></label><label>状态<select name="status">{% for key,label in STUDENT_STATUS.items() %}<option value="{{ key }}" {% if form.get('status')==key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>预计 / 实际毕业日期<input type="date" name="graduation_date" value="{{ form.get('graduation_date') or '' }}"></label><button>保存</button> <a href="{{ url_for('registrar.people_list',kind=kind) }}">取消</a><p class="muted">新增人员会同时开通账号，页面将显示系统编号与初始密码。</p></form>{% endblock %}
