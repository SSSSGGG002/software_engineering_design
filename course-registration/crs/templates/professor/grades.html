{% extends 'base.html' %}{% block content %}<h1>录入成绩</h1><p class="muted">{{ semester.name }} · 留空表示跳过，不删除已有成绩。</p><form class="toolbar"><select name="oid">{% for o in offerings %}<option value="{{ o.offering_id }}" {% if o.offering_id==oid %}selected{% endif %}>{{ o.course_id }} {{ o.title }} {{ o.section }}</option>{% endfor %}</select><button class="secondary">选择课程</button></form><form class="panel" method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><table><thead><tr><th>学号</th><th>姓名</th><th>原成绩</th><th>新成绩</th></tr></thead><tbody>{% for e in entries %}<tr><td>{{ e.student_id }}</td><td>{{ e.student_name }}</td><td>{{ e.grade or '未录入' }}</td><td><select name="grade_{{ e.student_id }}"><option value="">跳过 / 保持原值</option>{% for grade in ['A','B','C','D','F','I'] %}<option>{{ grade }}</option>{% endfor %}</select></td></tr>{% endfor %}</tbody></table><button>保存成绩</button></form>{% endblock %}
