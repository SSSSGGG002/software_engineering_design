{% extends 'base.html' %}{% block content %}<h1>开课 {{ oid }} · 花名册</h1><section class="panel"><table><thead><tr><th>学号</th><th>姓名</th><th>注册状态</th><th>成绩</th></tr></thead><tbody>{% for e in entries %}<tr><td>{{ e.student_id }}</td><td>{{ e.student_name }}</td><td>{{ ITEM_STATUS[e.status] }}</td><td>{{ e.grade or '暂未录入' }}</td></tr>{% else %}<tr><td colspan="4">暂无已注册学生。</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
