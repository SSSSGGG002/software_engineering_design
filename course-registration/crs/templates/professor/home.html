{% extends 'base.html' %}{% block content %}<p class="eyebrow">PROFESSOR / TEACHING</p><h1>我的授课</h1><form class="toolbar"><select name="semester">{% for s in semesters %}<option value="{{ s.code }}" {% if selected==s.code %}selected{% endif %}>{{ s.name }}</option>{% endfor %}</select><button class="secondary">查看学期</button></form><section class="panel"><table><thead><tr><th>课程</th><th>时间</th><th>人数</th><th>状态</th><th>操作</th></tr></thead><tbody>{% for o in offerings %}<tr><td>{{ o.label }}</td><td>{{ o.slot }}</td><td>{{ o.enrolled }}</td><td>{{ OFFERING_STATUS[o.status] }}</td><td><a href="{{ url_for('professor.roster',oid=o.offering_id) }}">花名册</a></td></tr>{% else %}<tr><td colspan="5">本学期尚无授课安排。</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
