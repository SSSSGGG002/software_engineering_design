{% extends 'base.html' %}{% block content %}<h1>选择授课</h1><p class="muted">{{ semester.name }} · 可认领本院系未被其他教授认领的开课。取消勾选即放弃授课。</p><form class="panel" method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><table><thead><tr><th>选择</th><th>课程</th><th>时间</th></tr></thead><tbody>{% for o in choices %}<tr><td><input aria-label="认领 {{ o.label }}" type="checkbox" name="offerings" value="{{ o.offering_id }}" {% if o.offering_id in mine %}checked{% endif %}></td><td>{{ o.label }}</td><td>{{ o.slot }}</td></tr>{% endfor %}</tbody></table><button>保存授课安排</button> <a href="{{ url_for('professor.home') }}">取消</a></form>{% endblock %}
