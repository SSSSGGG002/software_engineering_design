{% extends 'base.html' %}{% block content %}<h1>修改密码</h1><form class="panel narrow" method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">{% for key,label in [('old','原密码'),('new','新密码（至少 6 位）'),('confirm','确认新密码')] %}<label>{{ label }}<input name="{{ key }}" type="password" required maxlength="200"></label>{% endfor %}<button>保存新密码</button></form>{% endblock %}
